<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bae — Appointment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff0f6;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .hearts-bg {
      position: relative;
      border-radius: 20px;
      padding: 1.5rem;
      overflow: hidden;
      background: #fff0f6;
      width: 100%;
      max-width: 520px;
    }
    .hearts-bg::before {
      content: '♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡';
      position: absolute;
      inset: 0;
      font-size: 18px;
      color: #f9b8d0;
      line-height: 2;
      word-break: break-all;
      padding: 8px;
      pointer-events: none;
      letter-spacing: 6px;
    }
    .bae-card {
      position: relative;
      background: rgba(255,255,255,0.92);
      border: 1px solid #f4a0bc;
      border-radius: 16px;
      padding: 1.5rem;
    }
    .bae-header {
      background: linear-gradient(135deg, #f9b8d0, #f7a0c4);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .bae-header span { font-size: 22px; font-weight: 500; color: #8b1a4a; letter-spacing: 2px; }
    .bae-tagline { font-size: 13px; color: #b05070; text-align: center; margin-bottom: 1.25rem; margin-top: 6px; }
    .appt-details {
      background: #fff5f9;
      border: 1px solid #f4a0bc;
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1.25rem;
    }
    .appt-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 7px 0;
      border-bottom: 1px solid #fce4ec;
      gap: 10px;
    }
    .appt-row:last-child { border-bottom: none; }
    .appt-key { color: #b05070; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; min-width: 70px; flex-shrink: 0; }
    .appt-val { color: #5a0a2a; font-size: 14px; text-align: right; }
    .question { font-size: 15px; color: #8b1a4a; font-weight: 500; text-align: center; margin-bottom: 1rem; }
    .accept-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-yes {
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #f06292, #e91e8c);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-no {
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      background: #fff;
      color: #b05070;
      border: 1px solid #f4a0bc;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-yes:hover { opacity: 0.9; }
    .btn-no:hover { background: #fce4ec; }
    .btn-yes:disabled, .btn-no:disabled { opacity: 0.35; cursor: default; }
    .response-banner {
      margin-top: 1rem;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
    }
    .response-accepted { background: #fce4ec; color: #8b1a4a; border: 1px solid #f48fb1; }
    .response-declined { background: #f5f5f5; color: #777; border: 1px solid #ddd; }
    .screenshot-hint { font-size: 12px; color: #c07090; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
<div class="hearts-bg">
  <div class="bae-card">
    <div class="bae-header"><span>&#9825; bae &#9825;</span></div>
    <p class="bae-tagline">You have an appointment request!</p>

    <div class="appt-details" id="apptDetails">
      <!-- filled by JS -->
    </div>

    <p class="question" id="question">Do you accept this appointment?</p>

    <div class="accept-btns" id="acceptBtns">
      <button class="btn-yes" id="btnYes">&#9825; Yes, accept</button>
      <button class="btn-no"  id="btnNo">&#10005; No, decline</button>
    </div>

    <div class="response-banner" id="responseBanner" style="display:none;"></div>
    <p class="screenshot-hint" id="screenshotHint" style="display:none;">Screenshot this and send it back to bae &#128236;</p>
  </div>
</div>
<script>
  function formatDate(d) {
    if (!d) return '';
    var parts = d.split('-');
    var y = parts[0], m = parts[1], day = parts[2];
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var dateObj = new Date(parseInt(y), parseInt(m)-1, parseInt(day));
    return days[dateObj.getDay()] + ', ' + months[parseInt(m)-1] + ' ' + parseInt(day) + ', ' + y;
  }
  function formatTime(t) {
    if (!t) return '';
    var parts = t.split(':');
    var hr = parseInt(parts[0]), min = parts[1];
    var ampm = hr >= 12 ? 'PM' : 'AM';
    var hr12 = hr % 12 || 12;
    return hr12 + ':' + min + ' ' + ampm;
  }

  var params  = new URLSearchParams(window.location.search);
  var request = params.get('r') || '';
  var date    = params.get('d') || '';
  var time    = params.get('t') || '';
  var place   = params.get('p') || '';
  var notes   = params.get('n') || '';

  var rows = '';
  if (request) rows += '<div class="appt-row"><span class="appt-key">Request</span><span class="appt-val">' + request + '</span></div>';
  if (date)    rows += '<div class="appt-row"><span class="appt-key">Date</span><span class="appt-val">' + formatDate(date) + '</span></div>';
  if (time)    rows += '<div class="appt-row"><span class="appt-key">Time</span><span class="appt-val">' + formatTime(time) + '</span></div>';
  if (place)   rows += '<div class="appt-row"><span class="appt-key">The spot</span><span class="appt-val">' + place + '</span></div>';
  if (notes)   rows += '<div class="appt-row"><span class="appt-key">Notes</span><span class="appt-val">' + notes + '</span></div>';
  document.getElementById('apptDetails').innerHTML = rows;

  document.getElementById('btnYes').addEventListener('click', function() { respond('accepted'); });
  document.getElementById('btnNo').addEventListener('click',  function() { respond('declined'); });

  function respond(status) {
    document.getElementById('btnYes').disabled = true;
    document.getElementById('btnNo').disabled  = true;
    var banner = document.getElementById('responseBanner');
    if (status === 'accepted') {
      banner.className = 'response-banner response-accepted';
      banner.innerHTML = '&#9825;&#9825;&#9825;<br>Appointment accepted!<br>See you soon &#9825;';
    } else {
      banner.className = 'response-banner response-declined';
      banner.innerHTML = 'Appointment declined.<br>No worries &#9825;';
    }
    banner.style.display = 'block';
    document.getElementById('screenshotHint').style.display = 'block';
    document.getElementById('question').style.display = 'none';
  }
</script>
</body>
</html>
